<script id="report-data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

/* Findings files are sometimes a bare array (e.g. endpoints.json) and sometimes an
   object wrapping the list (e.g. flows.json -> {summary, flows:[...]}). Accept both
   so a hand-written findings file never silently blanks a whole section. */
function arr(v,key){ if(Array.isArray(v)) return v; return (v&&key&&Array.isArray(v[key]))?v[key]:[]; }
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tid(s){return String(s==null?"":s).replace(/[^a-zA-Z0-9_]/g,"");}
function slugify(s){return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,"-").replace(/^-|-$/g,"");}
function src(path,line){
  if(!path) return '<span class="dim">—</span>';
  const label = line ? path+":"+line : path;
  return '<span class="src" data-copy="'+esc(label)+'" title="点击复制 '+esc(label)+'">'+esc(label)+'</span>';
}
function badge(cls,txt){return '<span class="b '+cls+'">'+esc(txt)+'</span>';}
function mbadge(m){return badge(String(m||"").toLowerCase(),m);}
const AUTH_LABEL={public:"无需认证",user:"玩家 JWT","super-admin":"超管 JWT","internal-token":"内部服务令牌","query-ticket":"一次性 ticket"};
const AUTH_CLS={public:"n",user:"info","super-admin":"violet","internal-token":"warn","query-ticket":"acc"};
function authLabel(a){return AUTH_LABEL[a]||a;}
function authBadge(a){return badge(AUTH_CLS[a]||"n",a);}
function sevCls(s){return s==="高"||s==="high"?"danger":(s==="中"||s==="medium"?"warn":"n");}
function tbl(headers,rows,cls,rowAttrs){
  return '<div class="tblwrap"><table'+(cls?' class="'+cls+'"':'')+'><thead><tr>'+
    headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map((r,i)=>'<tr '+((rowAttrs&&rowAttrs[i])||'')+'>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
}
function kv(k,v){return '<div class="k">'+k+'</div><div class="v">'+v+'</div>';}
function qs(v){return esc(v==null?"—":v);}
/* Prose fields may carry light markup (bold, inline code). They may ALSO contain
   angle brackets that are not markup at all — generic types like `web::Data<AppState>`,
   redacted placeholders like `<user>`, comparison operators. Rendering those raw makes
   the browser swallow them as unknown tags and the text silently disappears.
   rich() passes a small allowlist of real tags through and escapes everything else. */
const RICH_TAGS=/^(\/?)(b|i|em|strong|code|span|small|br|ul|ol|li|p|div|a)\b/i;
function rich(v){
  if(v==null) return "";
  return String(v).replace(/<([^<>]*)>/g,(m,inner)=>RICH_TAGS.test(inner)?m:"&lt;"+inner+"&gt;");
}
/* Generation tooling is usually written as {entities, tsTypes, cli, ...}; a labelled
   [{label,value}] array is also accepted. Common keys get a readable label rather
   than raw camelCase. */
const LOADER_LABELS={how:"加载方式",pathResolution:"路径解析",onlyEnvVar:"环境变量",
                     secrets:"敏感值处理",reload:"热重载",defaults:"默认值",sources:"来源"};
const STACK_LABELS={framework:"框架",version:"版本",router:"路由",routerVersion:"路由版本",
                    ui:"UI",uiVersion:"UI 版本",state:"状态",dataFetching:"数据获取",
                    build:"构建",test:"测试",lint:"Lint",language:"语言",
                    packageManager:"包管理",devServerPort:"开发端口",apiBaseUrl:"API 基址",
                    proxy:"代理",envVars:"环境变量",pathAliases:"路径别名"};
const GEN_LABELS={entities:"实体",tsTypes:"TS 类型",cli:"CLI",cliVersion:"CLI 版本",
                  source:"来源",models:"模型",types:"类型",enums:"枚举",schema:"Schema"};
function genRows(g){
  if(Array.isArray(g)) return g.map(x=>'<li>'+esc(x.label)+'：<span class="mono">'+esc(x.value)+'</span></li>').join('');
  return Object.keys(g).map(k=>'<li>'+esc(GEN_LABELS[k]||k)+'：<span class="mono">'+
    esc(typeof g[k]==="string"?g[k]:JSON.stringify(g[k]))+'</span></li>').join('');
}
function searchEscape(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function hl(text,terms){
  let out=esc(text);
  terms.forEach(t=>{ if(!t) return;
    try{ out=out.replace(new RegExp("("+searchEscape(t)+")","gi"),"<mark>$1</mark>"); }catch(e){}
  });
  return out;
}
function fuzzy(hay,needle){
  hay=String(hay||"").toLowerCase(); needle=String(needle||"").toLowerCase().trim();
  if(!needle) return 0;
  const i=hay.indexOf(needle);
  if(i>=0) return 1000-i;
  let hi=0,score=0;
  for(const ch of needle){ const j=hay.indexOf(ch,hi); if(j<0) return -1; score+=10-(j-hi); hi=j+1; }
  return score;
}

/* ── navigation ───────────────────────────────────────── */
const SECTIONS=[
  {id:"overview",label:"Overview",icon:"▦",group:"开始",has:d=>!!d.meta},
  {id:"architecture",label:"Architecture",icon:"▤",group:"开始",has:d=>!!d.architecture},
  {id:"files",label:"File Tree",icon:"▸",group:"开始",has:d=>!!d.tree},
  {id:"modules",label:"Modules",icon:"▣",group:"代码",has:d=>arr(d.modules,"modules").length},
  {id:"api",label:"API Endpoints",icon:"⇄",group:"代码",has:d=>arr(d.endpoints,"endpoints").length},
  {id:"flows",label:"Request Flows",icon:"⇉",group:"代码",has:d=>arr(d.flows,"flows").length},
  {id:"database",label:"Database",icon:"▥",group:"数据与配置",has:d=>arr(d.database,"tables").length},
  {id:"config",label:"Configuration",icon:"⚙",group:"数据与配置",has:d=>arr(d.config,"items").length},
  {id:"auth",label:"Authentication",icon:"⚿",group:"数据与配置",has:d=>!!d.auth},
  {id:"frontend",label:"Frontend",icon:"◧",group:"客户端",has:d=>arr(d.frontend,"pages").length},
  {id:"jobs",label:"Background Jobs",icon:"◔",group:"运行时",has:d=>arr(d.jobs,"tasks").length},
  {id:"deps",label:"Dependencies",icon:"◈",group:"运行时",has:d=>arr(d.deps,"groups").length},
  {id:"deploy",label:"Build & Deploy",icon:"⬒",group:"运行时",has:d=>!!d.deploy},
  {id:"entry",label:"Important Files",icon:"★",group:"接手",has:d=>arr(d.entry,"order").length},
  {id:"risks",label:"Risks / Notes",icon:"⚠",group:"接手",has:d=>arr(d.risks,"risks").length}
];
const PAGES=SECTIONS.filter(s=>s.has(DATA));
const RENDER={};

/* ── Overview ─────────────────────────────────────────── */
RENDER.overview=function(){
  const o=DATA.overview||{}; const m=DATA.meta||{};
  let h='<h1>'+esc(m.name||"Project Analysis")+'</h1>';
  if(m.tagline) h+='<p class="lead">'+esc(m.tagline)+'</p>';
  if(o.stats&&o.stats.length){
    h+='<div class="grid g4">'+o.stats.map(s=>
      '<div class="stat"><div class="v">'+esc(s.value)+'</div><div class="l">'+esc(s.label)+'</div>'+
      (s.src?'<div class="x">'+esc(s.src)+'</div>':'')+'</div>').join('')+'</div>';
  }
  h+='<h2 id="ov-project">项目定位</h2><div class="grid g2">';
  h+='<div class="card">'+(o.oneLiner?'<h4>一句话</h4><p>'+esc(o.oneLiner)+'</p>':'')+
     (o.type?'<h4>项目类型</h4><p>'+esc(o.type)+'</p>':'')+
     (o.shape?'<h4>形态</h4><p>'+esc(o.shape)+'</p>':'')+
     (o.repoState?'<h4>仓库状态</h4><p class="mono small">'+esc(o.repoState)+'</p>':'')+'</div>';
  h+='<div class="card">'+(o.stack&&o.stack.length?'<h4>技术栈</h4><div class="row">'+o.stack.map(t=>badge("acc",t)).join(" ")+'</div>':'')+
     (o.archPoints&&o.archPoints.length?'<h4 style="margin-top:12px">架构要点</h4><ul class="tight small">'+o.archPoints.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'')+'</div>';
  h+='</div>';
  const map=DATA.architecture?(DATA.architecture.diagram||DATA.architecture.systemMap):"";
  if(map) h+='<h2 id="ov-map">System Map</h2>'+map;
  if(o.keyEntries&&o.keyEntries.length){
    h+='<h2 id="ov-entry">关键入口（先读这些）</h2>'+tbl(["文件","职责","为什么先读"],
      o.keyEntries.map(e=>[src(e.path,e.line),esc(e.role),esc(e.why)]));
  }
  if(o.surface&&o.surface.length){
    h+='<h2 id="ov-counts">Enumerated Surface</h2>'+tbl(["面","数量","备注"],
      o.surface.map(s=>[esc(s.area),'<span class="num">'+esc(s.count)+'</span>',esc(s.note)]));
  }
  if(o.caveats&&o.caveats.length){
    h+='<h2 id="ov-caveat">阅读本报告的注意事项</h2><div class="note warn"><ul class="tight">'+
       o.caveats.map(c=>'<li>'+rich(c)+'</li>').join('')+'</ul></div>';
  }
  return h;
};

/* ── Architecture ─────────────────────────────────────── */
function layersDiagram(layers){
  return '<div class="diagram"><div class="lay">'+layers.map((l,i)=>
      (i?'<div class="arw">▼</div>':'')+
      '<div class="laygroup" style="width:100%;max-width:900px"><div class="lbl">'+esc(l.name)+'</div>'+
      '<div class="box acc" style="min-width:260px"><div class="t">'+esc(l.path||l.name)+'</div>'+
      '<div class="s">'+esc((l.types||"").slice(0,120))+'</div></div>'+
      '<p class="small dim" style="text-align:center;margin:7px 0 0">'+esc(l.role)+'</p></div>').join('')+
    '</div></div>';
}
function moduleGraph(modules){
  return '<div class="tblwrap"><table><thead><tr><th>模块</th><th>依赖（上游）</th><th>被依赖（下游）</th></tr></thead><tbody>'+
    modules.map(m=>'<tr><td><b>'+esc(m.name)+'</b><div class="tiny dim mono">'+esc(m.path||"")+'</div></td>'+
      '<td>'+((m.upstream||[]).map(u=>badge("n",u)).join(" ")||'<span class="dim">—</span>')+'</td>'+
      '<td>'+((m.downstream||[]).map(d=>badge("info",d)).join(" ")||'<span class="dim">—</span>')+'</td></tr>').join('')+
    '</tbody></table></div>';
}
RENDER.architecture=function(){
  const a=DATA.architecture||{};
  let h='<h1>Architecture</h1>'+(a.summary?'<p class="lead">'+rich(a.summary)+'</p>':'');
  h+='<h2 id="arch-system">系统分层与边界</h2>'+(a.diagram||(a.layers&&a.layers.length?layersDiagram(a.layers):'<p class="dim">未提供</p>'));
  if(a.layers&&a.layers.length){
    h+='<h2 id="arch-layers">各层职责</h2>'+tbl(["层","路径","职责","关键类型"],
      a.layers.map(l=>['<b>'+esc(l.name)+'</b>',src(l.path),esc(l.role),'<span class="mono small">'+esc(l.types||"")+'</span>']));
  }
  if(a.modules&&a.modules.length){
    h+='<h2 id="arch-modules">模块依赖（实际调用方向）</h2>'+moduleGraph(a.modules);
  }
  if(a.engines&&a.engines.length){
    h+='<h2 id="arch-engines">核心变体 / 引擎的差异</h2>'+tbl(["变体","模式","数据模型","核心流程","关键文件"],
      a.engines.map(e=>['<b>'+esc(e.engine)+'</b>',esc(e.mode),esc(e.model),esc(e.flow),
        '<span class="mono small">'+(e.files||[]).map(f=>src(f)).join('<br>')+'</span>']));
  }
  if(a.decisions&&a.decisions.length){
    h+='<h2 id="arch-decisions">值得注意的架构决策</h2><div class="grid g2">'+
       a.decisions.map(d=>'<div class="card tight"><h4>'+esc(d.title)+'</h4><p class="small">'+rich(d.text)+'</p>'+
         (d.src?'<div class="small">'+src(d.src,d.line)+'</div>':'')+'</div>').join('')+'</div>';
  }
  return h;
};

/* ── File Tree ────────────────────────────────────────── */
function treeNode(n){
  const isDir=n.type==="dir";
  const core=n.core?'<span class="tag core">核心</span>':'';
  const gen=n.generated?'<span class="tag gen">生成</span>':'';
  if(isDir){
    const hasKids=n.children&&n.children.length;
    return '<div class="ftdir" data-path="'+esc(n.path)+'">'+
      '<span class="ftn dirname" id="dir-'+slugify(n.path)+'" data-path="'+esc(n.path)+'" data-kind="dir">'+
        (hasKids?'<span class="caret">▾</span>':'<span class="caret"> </span>')+esc(n.name)+'/'+core+'</span>'+
      (hasKids?'<div class="ftkids" data-open="1">'+n.children.map(treeNode).join('')+'</div>':'')+
    '</div>';
  }
  return '<div><span class="ftn fname" id="file-'+slugify(n.path)+'" data-path="'+esc(n.path)+'" data-kind="file">'+
    '<span class="caret"> </span>'+esc(n.name)+core+gen+
    (n.lines?'<span class="dim tiny"> '+n.lines+'L</span>':'')+'</span></div>';
}
RENDER.files=function(){
  const t=DATA.tree;
  let h='<h1>File Tree</h1><p class="lead">已排除依赖 / 构建产物 / 缓存目录；'+
    '<span class="tag core">核心</span> 是理解项目必读项，<span class="tag gen">生成</span> 是不可手改的产物。点击文件查看详情。</p>';
  h+='<div class="filters"><input type="search" id="ftsearch" placeholder="过滤路径（如 bootstrap、src/api、migration）…">'+
     '<button class="topbtn" id="ftcollapse">全部收起</button>'+
     '<button class="topbtn" id="ftexpand">展开到深度 2</button>'+
     '<span class="count" id="ftcount">'+esc(DATA.stats&&DATA.stats.treeCount||"")+'</span></div>';
  h+='<div class="flex2"><div class="card" id="filetree">'+treeNode(t)+'</div>'+
     '<div id="filedetail"><div class="card"><p class="dim small">从左侧选择一个文件或目录查看用途、依赖与关联。</p></div></div></div>';
  return h;
};
function bindFiles(){
  const root=$("#filetree"); if(!root) return;
  root.addEventListener("click",ev=>{
    const n=ev.target.closest(".ftn"); if(!n) return;
    const p=n.dataset.path, kind=n.dataset.kind;
    if(kind==="dir"){
      const box=n.parentElement.querySelector(".ftkids");
      if(box){ box.classList.toggle("hidden");
        n.querySelector(".caret").textContent=box.classList.contains("hidden")?"▸":"▾"; }
    }
    $$(".ftn.sel",root).forEach(x=>x.classList.remove("sel"));
    n.classList.add("sel");
    showFileDetail(p,kind);
    ev.stopPropagation();
  });
  const search=$("#ftsearch");
  if(search) search.addEventListener("input",()=>paintTree(search.value.trim().toLowerCase()));
  const col=$("#ftcollapse"); if(col) col.addEventListener("click",()=>{
    $$(".ftkids",root).forEach(k=>k.classList.add("hidden"));
    $$(".ftn.dirname .caret",root).forEach(c=>c.textContent="▸"); });
  const exp=$("#ftexpand"); if(exp) exp.addEventListener("click",()=>{
    paintTree("");
    $$(".ftdir",root).forEach(d=>{
      const lvl=d.dataset.path.split("/").length, k=d.querySelector(":scope > .ftkids");
      if(k){ const open=lvl<=2; k.classList.toggle("hidden",!open);
        const c=d.querySelector(":scope > .ftn .caret"); if(c) c.textContent=open?"▾":"▸"; }
    });
  });
}
function paintTree(q){
  const root=$("#filetree"); if(!root) return;
  const walk=el=>{
    $$(":scope > .ftdir",el).forEach(d=>{
      walk(d);
      const hit=q===""?true:(d.dataset.path||"").toLowerCase().includes(q)||
        $$(".ftn",d).some(x=>(x.dataset.path||"").toLowerCase().includes(q));
      d.style.display=hit?"":"none";
      const kids=d.querySelector(":scope > .ftkids");
      if(kids&&q){ const sub=$$(".ftn",d).some(x=>(x.dataset.path||"").toLowerCase().includes(q));
        kids.classList.toggle("hidden",!sub);
        const c=d.querySelector(":scope > .ftn .caret"); if(c) c.textContent=sub?"▾":"▸"; }
    });
    $$(":scope > div > .ftn.fname",el).forEach(f=>{
      f.parentElement.style.display=(q===""||(f.dataset.path||"").toLowerCase().includes(q))?"":"none"; });
  };
  walk(root);
}
function findNode(n,path){
  if(n.path===path) return n;
  for(const c of (n.children||[])){ const r=findNode(c,path); if(r) return r; }
  return null;
}
function showFileDetail(path,kind){
  const box=$("#filedetail"); if(!box) return;
  const n=findNode(DATA.tree,path);
  if(!n){ box.innerHTML='<div class="card"><p class="dim">无详情</p></div>'; return; }
  const note=(DATA.fileNotes||{})[path]||{};
  let h='<div class="card"><h3 style="margin-top:0" class="mono">'+esc(n.name)+(kind==="dir"?"/":"")+'</h3>'+
    '<div class="small dim mono" style="word-break:break-all">'+esc(path)+'</div>';
  if(n.lines) h+='<p class="small dim">'+n.lines+' 行</p>';
  if(n.role) h+='<h4>用途</h4><p class="small">'+esc(n.role)+'</p>';
  if(note.module) h+='<h4>所属模块</h4><p class="small mono">'+esc(note.module)+'</p>';
  if(n.core) h+='<p>'+badge("acc","核心文件")+'</p>';
  if(n.generated) h+='<p>'+badge("n","生成产物 — 不要手改")+'</p>';
  ["exports|重要导出","deps|依赖","usedBy|被谁使用","api|关联 API"].forEach(spec=>{
    const [k,label]=spec.split("|");
    if(note[k]&&note[k].length) h+='<h4>'+label+'</h4><ul class="tight small mono">'+note[k].map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>';
  });
  if(note.note) h+='<h4>备注</h4><p class="small">'+esc(note.note)+'</p>';
  if(!n.role&&!note.role) h+='<p class="small dim">该路径未登记注解 —— 其具体职责<b>未确认</b>。</p>';
  if(kind==="dir"&&n.children){
    h+='<h4>直接子项 ('+n.children.length+')</h4><ul class="tight small mono" style="max-height:220px;overflow:auto">'+
      n.children.slice(0,60).map(c=>'<li>'+esc(c.name)+(c.type==="dir"?"/":"")+'</li>').join('')+'</ul>';
  }
  box.innerHTML=h+'</div>';
}

/* ── Modules ──────────────────────────────────────────── */
RENDER.modules=function(){
  const m=DATA.modules||{}; const list=m.modules||[];
  let h='<h1>Core Modules</h1>'+(m.summary?'<p class="lead">'+rich(m.summary)+'</p>':'');
  h+='<div class="filters"><input type="search" id="modsearch" placeholder="过滤模块 / 符号 / 文件…">'+
     '<span class="count" id="modcount">'+list.length+' modules</span></div><div id="modlist">';
  list.forEach(mod=>{
    h+='<div class="card modcard" id="module-'+slugify(mod.name)+'" data-text="'+
      esc((mod.name+" "+(mod.path||"")+" "+(mod.keyFiles||[]).map(f=>f.path).join(" ")+" "+
           (mod.keySymbols||[]).map(s=>s.name).join(" ")).toLowerCase())+'">'+
      '<div class="spread"><h3 style="margin:0">'+esc(mod.name)+'</h3><span class="mono small dim">'+esc(mod.path||"")+'</span></div>'+
      '<p class="small" style="margin-top:5px">'+esc(mod.responsibility||"")+'</p>';
    if(mod.entry) h+='<p class="small">入口：'+src(mod.entry)+'</p>';
    h+='<div class="grid g2" style="margin-top:8px">';
    if((mod.keyFiles||[]).length) h+='<div><h4>入口 / 核心文件</h4><ul class="tight small">'+
      mod.keyFiles.map(f=>'<li>'+src(f.path)+' — '+esc(f.role||"")+'</li>').join('')+'</ul></div>';
    if((mod.keySymbols||[]).length) h+='<div><h4>核心符号</h4><ul class="tight small">'+
      mod.keySymbols.map(s=>'<li><span class="mono">'+esc(s.name)+'</span> <span class="dim tiny">'+esc(s.kind||"")+'</span> — '+esc(s.role||"")+'</li>').join('')+'</ul></div>';
    h+='</div><div class="grid g2" style="margin-top:6px">'+
      '<div><h4>上游依赖</h4><div class="row small">'+((mod.upstream||[]).map(x=>badge("n",x)).join(" ")||'<span class="dim">—</span>')+'</div></div>'+
      '<div><h4>被调用方</h4><div class="row small">'+((mod.downstream||[]).map(x=>badge("info",x)).join(" ")||'<span class="dim">—</span>')+'</div></div></div>';
    if((mod.routes||[]).length) h+='<h4>HTTP 面</h4><div class="row small mono">'+mod.routes.map(r=>'<span class="b n">'+esc(r)+'</span>').join(" ")+'</div>';
    if(mod.lifecycle) h+='<h4>生命周期</h4><p class="small">'+esc(mod.lifecycle)+'</p>';
    if(mod.notes) h+='<p class="small" style="margin-top:7px"><b>备注：</b>'+esc(mod.notes)+'</p>';
    h+='</div>';
  });
  h+='</div>';
  if((m.largestFiles||[]).length){
    h+='<h2 id="mod-large">超大文件（接手风险）</h2>'+tbl(["文件","行数","说明","风险"],
      m.largestFiles.map(f=>[src(f.path),'<span class="num">'+esc(f.lines)+'</span>',esc(f.why||""),esc(f.risk||"")]));
  }
  if((m.coupling||[]).length){
    h+='<h2 id="mod-coupling">耦合点</h2>'+tbl(["模块","耦合对象","类型","证据","影响"],

function epRow(e,compact){
  const tail=e.path.split("/").filter(Boolean).pop()||e.path;
  const label=compact?("/"+tail):e.path;
  const also=(e.alsoAt&&e.alsoAt.length)?' <span class="b warn" title="同一 handler 在多个前缀下注册">多路径注册</span>':'';
  return '<div class="ep'+(compact?" leaf":"")+'" id="api-'+esc(e.id)+'" data-m="'+esc(e.method)+'" data-mod="'+esc(e.module||"")+'"'+
    ' data-auth="'+esc(e.auth)+'" data-path="'+esc(e.path)+'"'+
    ' data-text="'+esc((e.path+" "+e.handler+" "+e.file+" "+(e.module||"")).toLowerCase())+'">'+
    '<div class="hd"><span class="b '+esc(String(e.method).toLowerCase())+'">'+esc(e.method)+'</span>'+
      '<span class="p">'+esc(label)+'</span>'+
      (compact?'':'<span class="h">'+esc(e.handler)+'()</span>')+also+
      '<span style="margin-left:auto" class="row">'+badge("n",e.module||"")+' '+authBadge(e.auth)+'</span></div>'+
    '<div class="bd"><div class="kv">'+
      kv("Handler",'<span class="mono">'+esc(e.handler)+'()</span>')+
      kv("全路径",'<span class="mono">'+esc(e.method)+' '+esc(e.path)+'</span>')+
      kv("源码",src(e.file,e.line))+
      kv("模块",esc(e.module||"—"))+
      kv("认证",authBadge(e.auth)+' '+esc(authLabel(e.auth)))+
      kv("说明",qs(e.summary||e.note))+
      (e.chain?kv("挂载链",'<span class="mono small">'+esc(e.chain)+'</span>'):"")+
      (e.middleware?kv("中间件",'<span class="mono small">'+esc(e.middleware)+'</span>'):"")+
      (e.alsoAt&&e.alsoAt.length?kv("同 handler 其它路径",'<span class="mono small">'+e.alsoAt.map(esc).join('<br>')+'</span>'):"")+
      (e.mounts&&e.mounts.length?kv("挂载点",'<span class="mono small">'+e.mounts.map(esc).join(" · ")+'</span>'):"")+
    '</div></div></div>';
}
function apiTree(eps){
  const root={seg:"",path:"",kids:{},order:[],eps:[]};
  eps.forEach(e=>{
    const segs=e.path.split("/").filter(Boolean);
    let n=root;
    segs.forEach((sg,i)=>{
      if(!n.kids[sg]){ n.kids[sg]={seg:sg,path:"/"+segs.slice(0,i+1).join("/"),kids:{},order:[],eps:[]}; n.order.push(sg); }
      n=n.kids[sg];
    });
    n.eps.push(e);
  });
  return root;
}
function apiCount(n){ let c=n.eps.length; n.order.forEach(sg=>{ c+=apiCount(n.kids[sg]); }); return c; }
function apiTreeHtml(node,depth){
  let h="";
  node.order.forEach(sg=>{
    const k=node.kids[sg], hasKids=k.order.length>0, open=depth<2;
    const methods=[...new Set(k.eps.map(e=>e.method))];
    h+='<div class="epdir" data-path="'+esc(k.path)+'" data-depth="'+depth+'">'+
       '<div class="ephd"><span class="caret">'+(hasKids?(open?"▾":"▸"):" ")+'</span>'+
         '<span class="seg">'+esc(k.seg)+'</span>'+
         '<span class="cnt">'+apiCount(k)+'</span>'+
         (methods.length?'<span class="ms">'+methods.map(m=>'<span class="b '+m.toLowerCase()+'">'+m+'</span>').join("")+'</span>'
                        :'<span class="ms dim tiny">path 本身无端点</span>')+
       '</div><div class="epkids'+(open?"":" hidden")+'">'+
         k.eps.slice().sort((a,b)=>a.method<b.method?-1:1).map(e=>epRow(e,true)).join("")+
         apiTreeHtml(k,depth+1)+'</div></div>';
  });
  return h;
}

function bindApi(){
  const body=$("#epbody"); if(!body) return;
  const q=$("#epq"),m=$("#epm"),mod=$("#epmod"),a=$("#epa"),cnt=$("#apicount");
  const eps=arr(DATA.endpoints,"endpoints");
  let view="tree";
  const activeFilter=()=>!!(q.value.trim()||m.value||mod.value||a.value);
  const match=el=>(!m.value||el.dataset.m===m.value)&&(!mod.value||el.dataset.mod===mod.value)&&
                  (!a.value||el.dataset.auth===a.value)&&
                  (!q.value.trim()||el.dataset.text.includes(q.value.trim().toLowerCase()));
  function setExpanded(open){
    $$(".epkids",body).forEach(k=>k.classList.toggle("hidden",!open));
    $$(".ephd .caret",body).forEach(c=>{ if(c.parentElement.parentElement.querySelector(":scope > .epkids")) c.textContent=open?"▾":"▸"; });
  }
  function resetExpansion(){
    $$(".epdir",body).forEach(d=>{
      const k=d.querySelector(":scope > .epkids"); if(!k) return;
      const open=(+d.dataset.depth)<2;
      k.classList.toggle("hidden",!open);
      const c=d.querySelector(":scope > .ephd .caret"); if(c) c.textContent=open?"▾":"▸";
    });
  }
  function renderBody(){
    body.innerHTML = view==="tree"
      ? '<div id="eptree">'+apiTreeHtml(apiTree(eps),0)+'</div>'
      : '<div id="eplist">'+eps.map(e=>epRow(e,false)).join("")+'</div>';
  }
  function apply(){
    let n=0;
    $$(".ep",body).forEach(el=>{ const ok=match(el); el.classList.toggle("hidden",!ok); if(ok) n++; });
    if(view==="tree"){
      $$(".epdir",body).slice().reverse().forEach(d=>{
        const hit=$$(".ep",d).some(e=>!e.classList.contains("hidden"));
        d.classList.toggle("hidden",!hit);
        const k=d.querySelector(":scope > .epkids"); if(!k) return;
        const c=d.querySelector(":scope > .ephd .caret");
        if(activeFilter()){ k.classList.toggle("hidden",!hit); if(c) c.textContent=hit?"▾":"▸"; }
        else if(c&&!k.classList.contains("hidden")) c.textContent="▾";
      });
    }
    cnt.textContent=n+" / "+eps.length+" endpoints"+(view==="tree"?" · 前缀树":" · 列表");
  }
  renderBody(); resetExpansion(); apply();
  [q,m,mod,a].forEach(el=>el.addEventListener("input",()=>{
    if(!activeFilter()&&view==="tree") resetExpansion(); apply(); }));
  const clr=$("#epclear"); if(clr) clr.addEventListener("click",()=>{
    q.value="";m.value="";mod.value="";a.value=""; if(view==="tree") resetExpansion(); apply(); });
  const ex=$("#epexpand"); if(ex) ex.addEventListener("click",()=>{ if(view==="tree"){ setExpanded(true); apply(); } });
  const co=$("#epcollapse"); if(co) co.addEventListener("click",()=>{ if(view==="tree"){ setExpanded(false); apply(); } });
  $$(".vtabs button").forEach(btn=>btn.addEventListener("click",()=>{
    view=btn.dataset.view;
    $$(".vtabs button").forEach(b=>b.classList.toggle("on",b===btn));
    renderBody(); if(view==="tree") resetExpansion(); apply();
  }));
  body.addEventListener("click",ev=>{
    const hd=ev.target.closest(".ephd");
    if(hd){ const d=hd.parentElement,k=d.querySelector(":scope > .epkids");
      if(k){ k.classList.toggle("hidden");
        const c=hd.querySelector(".caret"); if(c) c.textContent=k.classList.contains("hidden")?"▸":"▾"; }
      return; }
    const row=ev.target.closest(".ep>.hd");
    if(row) row.parentElement.classList.toggle("open");
  });
}

  const tiles=Object.keys(st).filter(k=>st[k]);
  if(tiles.length) h+='<div class="grid g4">'+tiles.map(k=>

  if(f.dataFlowDiagram) h+='<h2 id="fe-dataflow">数据流</h2>'+f.dataFlowDiagram;
  if((f.pages||[]).length){
    const groups=[...new Set(f.pages.map(p=>p.group).filter(Boolean))];

       '<input type="search" id="pgq" placeholder="过滤路由 / 组件 / API…">'+

         null,
         f.pages.map(p=>'class="pgrow" data-g="'+esc(p.group||"")+'" data-text="'+
           esc((p.route+" "+(p.component||"")+" "+p.file+" "+(p.apis||[]).join(" ")).toLowerCase())+'"'))+'</div>';
  }
  if(f.apiClient&&(f.apiClient.files||[]).length){
    h+='<h2 id="fe-api">API 客户端层</h2>'+tbl(["文件","职责","说明"],
      f.apiClient.files.map(x=>[src(x.path),esc(x.role||""),esc(x.notes||"")]));
    if(f.apiClient.authTokenStorage||f.apiClient.interceptors){
      h+='<div class="card tight small">'+
        (f.apiClient.authTokenStorage?'<p><b>凭据存储：</b>'+esc(f.apiClient.authTokenStorage)+'</p>':'')+
        (f.apiClient.interceptors?'<p><b>拦截器：</b>'+esc(f.apiClient.interceptors)+'</p>':'')+
        (f.apiClient.errorEnvelope?'<p><b>错误信封：</b>'+esc(f.apiClient.errorEnvelope)+'</p>':'')+'</div>';
    }
  }
  if((f.stores||[]).length) h+='<h3>状态存储</h3>'+tbl(["文件","职责","持久化","使用者"],
    f.stores.map(s=>[src(s.path),esc(s.role||""),esc(s.persistedState||"—"),esc(s.usedBy||"")]));
  if((f.sse||[]).length) h+='<h2 id="fe-sse">实时通信</h2>'+tbl(["Hook / 机制","后端端点","用途","源码"],
    f.sse.map(s=>['<span class="mono">'+esc(s.hook)+'</span>','<span class="mono">'+esc(s.endpoint)+'</span>',esc(s.purpose||""),src(s.file)]));
  if(f.navigation){

      Object.keys(f.navigation).filter(k=>k!=="files"&&f.navigation[k]).map(k=>

  }
  if((f.quirks||[]).length) h+='<h2 id="fe-quirks">前端注意点</h2><ul class="tight small">'+f.quirks.map(q=>'<li>'+q+'</li>').join('')+'</ul>';

function bindFrontend(){
  const list=$("#pglist"); if(!list) return;
  const q=$("#pgq"),g=$("#pgg"),cnt=$("#pgcount");
  function apply(){ const Q=q.value.trim().toLowerCase(),G=g?g.value:""; let n=0;
    $$(".pgrow",list).forEach(r=>{ const ok=(!G||r.dataset.g===G)&&(!Q||r.dataset.text.includes(Q));
      r.style.display=ok?"":"none"; if(ok)n++; });
    cnt.textContent=n+" / "+DATA.frontend.pages.length+" pages"; }
  [q,g].filter(Boolean).forEach(el=>el.addEventListener("input",apply)); apply();
}

/* ── global search ────────────────────────────────────── */
function buildIndex(){
  const idx=[];
  const push=(kind,title,sub,page,anchor)=>idx.push({kind:kind,title:title,sub:sub||"",page:page,anchor:anchor||""});
  arr(DATA.endpoints,"endpoints").forEach(e=>push("API",e.method+" "+e.path,(e.module||"")+" · "+e.handler,"api","api-"+e.id));
  ((DATA.modules&&DATA.modules.modules)||[]).forEach(m=>{
    push("模块",m.name,m.responsibility,"modules","module-"+slugify(m.name));
    (m.keySymbols||[]).forEach(s=>push("符号",s.name,m.name+" · "+(s.kind||""),"modules","module-"+slugify(m.name)));
    (m.keyFiles||[]).forEach(f=>push("文件",f.path,m.name,"modules","module-"+slugify(m.name)));
  });
  ((DATA.database&&DATA.database.tables)||[]).forEach(t=>push("模型","db:"+t.name,t.purpose||"","database","model-"+tid(t.name)));
  ((DATA.database&&DATA.database.enums)||[]).forEach(e=>push("枚举",e.name,(e.values||[]).join("|"),"database","db-enums"));
  ((DATA.config&&DATA.config.items)||[]).forEach(i=>push("配置",(i.section?i.section+".":"")+i.key,i.purpose||"","config","cf-settings"));
  const ds=DATA.config&&DATA.config.dynamicSettings;
  if(ds) (ds.defaults||[]).forEach(s=>push("设置",s.key,s.purpose||"","config","cfg-settings"));
  if(DATA.config&&DATA.config.sidecarEnv) Object.keys(DATA.config.sidecarEnv).forEach(k=>{ if(k==="note") return;
    (DATA.config.sidecarEnv[k]||[]).forEach(e=>push("环境变量",e.name,k,"config","cfg-sidecar")); });
  arr(DATA.flows,"flows").forEach(f=>{ push("流程",f.title,f.summary||"","flows",f.id);
    (f.steps||[]).forEach(s=>push("步骤",s.what,f.title,"flows",f.id)); });
  ((DATA.frontend&&DATA.frontend.pages)||[]).forEach(p=>push("页面",p.route,(p.component||"")+" · "+p.file,"frontend",""));
  ((DATA.frontend&&DATA.frontend.sse)||[]).forEach(s=>push("实时",s.hook,s.endpoint||"","frontend","fe-sse"));
  ((DATA.jobs&&DATA.jobs.tasks)||[]).forEach(t=>push("任务",t.key,t.purpose||"","jobs","jobs-tasks"));
  ((DATA.deps&&DATA.deps.groups)||[]).forEach(g=>(g.items||[]).forEach(i=>push("依赖",i.name,g.name,"deps","dep-"+slugify(g.name))));
  ((DATA.risks&&DATA.risks.risks)||[]).forEach(r=>push("风险",r.title,r.kind||"","risks","risk-"+slugify(r.title)));
  ((DATA.entry&&DATA.entry.order)||[]).forEach(s=>push("入口",s.path,s.why||"","entry","en-order"));
  (function walk(n){ if(n.path!=="."){
      const anc="dir-"+slugify(n.path);
      push(n.type==="dir"?"目录":"文件",n.path,n.role||"","files",anc);
      if(n.core) push("核心文件",n.path,n.role||"","files",n.type==="dir"?anc:"file-"+slugify(n.path)); }
    (n.children||[]).forEach(walk); })(DATA.tree||{path:".",children:[]});
  return idx;
}
let INDEX=[];
function doSearch(q){
  const terms=q.trim().split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const scored=[];
  for(const it of INDEX){
    let total=0, ok=true;
    for(const t of terms){
      const a=fuzzy(it.title,t), b=fuzzy(it.sub,t)*0.35, c=(it.kind.toLowerCase()===t.toLowerCase())?500:0;
      const best=Math.max(a,b,c);
      if(best<0){ ok=false; break; }
      total+=best;
    }
    if(ok) scored.push([total,it]);
  }
  scored.sort((x,y)=>y[0]-x[0]);
  return scored.slice(0,60).map(x=>x[1]);
}
function bindSearch(){
  const inp=$("#gsearch"),box=$("#results");
  let sel=-1,cur=[];
  const close=()=>{box.classList.remove("open");sel=-1;cur=[];};
  function render(items,q){
    cur=items;
    if(!q.trim()){ close(); return; }
    if(!items.length){ box.innerHTML='<div class="empty">无匹配结果</div>'; box.classList.add("open"); return; }
    const terms=q.trim().split(/\s+/);
    box.innerHTML=items.map((it,i)=>'<div class="res'+(i===sel?" sel":"")+'" data-i="'+i+'">'+
      '<span class="k">'+esc(it.kind)+'</span><span class="t">'+hl(it.title,terms)+'</span>'+
      (it.sub?'<span class="s">'+esc(it.sub)+'</span>':'')+'</div>').join('');
    box.classList.add("open");
  }
  function go(it){ location.hash = it.anchor ? it.page+"::"+it.anchor : it.page; }
  inp.addEventListener("input",()=>{ sel=-1; render(doSearch(inp.value),inp.value); });
  inp.addEventListener("focus",()=>{ if(inp.value.trim()) render(doSearch(inp.value),inp.value); });
  inp.addEventListener("keydown",ev=>{
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ ev.preventDefault();
      if(!cur.length) return; sel=(sel+(ev.key==="ArrowDown"?1:-1)+cur.length)%cur.length;
      render(cur,inp.value); return; }
    if(ev.key==="Enter"){ const t=cur[sel>=0?sel:0]; if(t){ go(t); close(); inp.blur(); } return; }
    if(ev.key==="Escape"){ close(); inp.blur(); }
  });
  box.addEventListener("click",ev=>{ const r=ev.target.closest(".res"); if(!r) return; go(cur[+r.dataset.i]); close(); });
  document.addEventListener("click",ev=>{ if(!$("#searchwrap").contains(ev.target)) close(); });
  document.addEventListener("keydown",ev=>{
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="k"){ ev.preventDefault(); inp.focus(); inp.select(); }
    if(ev.key==="Escape") close();
  });
}

/* ── router / theme / copy ────────────────────────────── */
function currentPage(){
  const page=location.hash.replace(/^#/,"").split("::")[0];
  return PAGES.some(p=>p.id===page) ? page : (PAGES[0]||{id:"overview"}).id;
}
function renderAll(){
  $("#main").innerHTML=PAGES.map(p=>'<section class="page" id="page-'+p.id+'">'+
    (RENDER[p.id]?RENDER[p.id]():'')+'</section>').join('');
  [bindFiles,bindApi,bindModules,bindDatabase,bindConfig,bindFrontend].forEach(fn=>{
    try{ fn(); }catch(e){ console.error("section binder failed",e); }
  });
  INDEX=buildIndex();
  bindSearch();
  const groups=[];
  PAGES.forEach(p=>{ const last=groups[groups.length-1];
    if(!last||last.name!==p.group) groups.push({name:p.group,items:[p]}); else last.items.push(p); });
  $("#sidebar").innerHTML=groups.map(g=>'<div class="grp">'+esc(g.name)+'</div>'+
    g.items.map(p=>'<a data-page="'+p.id+'" href="#'+p.id+'"><span>'+p.icon+'</span>'+esc(p.label)+'</a>').join('')).join('');
  bindCopy();
  route();
}
function route(){
  const h=location.hash.replace(/^#/,"");
  const page=currentPage();
  const anchor=h.split("::")[1]||"";
  $$(".page").forEach(s=>s.classList.toggle("active",s.id==="page-"+page));
  $$("#sidebar a").forEach(a=>a.classList.toggle("active",a.dataset.page===page));
  window.scrollTo(0,0);
  if(!anchor) return;
  const el=document.getElementById(anchor);
  if(!el) return;
  if(anchor.indexOf("file-")===0||anchor.indexOf("dir-")===0){
    let p=el.closest(".ftdir");
    while(p){ const k=p.parentElement;
      if(k&&k.classList.contains("ftkids")){ k.classList.remove("hidden");
        const c=p.querySelector(":scope > .ftn .caret"); if(c) c.textContent="▾"; }
      p=k?k.closest(".ftdir"):null; }
    if(el.classList.contains("ftn")) el.click();
  }
  if(el.tagName==="DETAILS") el.open=true;
  const d=el.closest("details"); if(d) d.open=true;
  const e=el.closest(".ep");
  if(e){ e.classList.add("open");
    let p=e.parentElement;
    while(p){ if(p.classList&&p.classList.contains("epkids")){ p.classList.remove("hidden");
        const c=p.parentElement&&p.parentElement.querySelector(":scope > .ephd .caret");
        if(c) c.textContent="▾"; }
      p=p.parentElement; }
  }
  setTimeout(()=>{ el.scrollIntoView({block:"start",behavior:"smooth"}); flash(el); },30);
}
function flash(el){
  const old=el.style.background;
  el.style.background="var(--accent-soft)";
  setTimeout(()=>{ el.style.background=old; },900);
}
function bindCopy(){
  document.addEventListener("click",ev=>{
    const s=ev.target.closest(".src"); if(!s) return;
    const txt=s.dataset.copy;
    const done=()=>{ const o=s.textContent; s.classList.add("copied"); s.textContent="✓ "+txt;
      setTimeout(()=>{ s.textContent=o; s.classList.remove("copied"); },900); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,done);
    else { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }
  });
}
function applyTheme(t){
  document.documentElement.dataset.theme =
    t==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : t;
}
function initTheme(){
  applyTheme(localStorage.getItem("fctf-theme")||"light");
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
    if((localStorage.getItem("fctf-theme")||"light")==="auto") applyTheme("auto"); });
  $("#themebtn").addEventListener("click",()=>{
    const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
    localStorage.setItem("fctf-theme",next); applyTheme(next);
  });
}
$("#menubtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
if(matchMedia("(max-width:860px)").matches) $("#menubtn").style.display="";
window.addEventListener("hashchange",route);
initTheme();
renderAll();
</script>
